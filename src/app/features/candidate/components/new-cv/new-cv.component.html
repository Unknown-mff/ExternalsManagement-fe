@if (isLoading$ | async) {
  <app-loader
    [message]="loadingMessage$ | async"
    [withOverlay]="true">
  </app-loader>
}

<div class="new-form-card-wrapper">
  <p-panel class="p-mb-5 new-form-card-container p-mt-20">
    <ng-template pTemplate="header">
      <h3>{{ 'advancedNewCV' | translate }}</h3>
    </ng-template>
    <p-fileUpload
      name="cv"
      customUpload="true"
      accept=".pdf,.doc,.docx"
      maxFileSize="5000000"
      [chooseLabel]="'chooseFile' | translate"
      [uploadLabel]="'uploadFile' | translate"
      [cancelLabel]="'cancelFile' | translate"
      (onSelect)="onFileSelected($event)"
      (uploadHandler)="uploadCv()"
      (onClear)="onFileCleared()"
      [auto]="true"
    >
      <ng-template pTemplate="content">
        <div class="drag-drop-message">
          {{ 'dragDropMessage' | translate }}
        </div>
      </ng-template>
    </p-fileUpload>

    @if (successMessage) {
      <div class="mt-4 p-3 rounded-lg bg-green-100 text-green-800 border border-green-300">
        {{ successMessage }}
      </div>
    }
  </p-panel>
</div>
